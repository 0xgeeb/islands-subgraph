specVersion: 0.0.2
description: KodiakIslandWithRouter
repository:
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: KodiakIslandWithRouter
    network: {{ network }}
    source:
      address: "{{ island_address }}"
      abi: KodiakIslandWithRouter
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - IslandDepositor
      abis:
        - name: KodiakIslandWithRouter
          file: ./abis/{{ island_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleIslandTransfer
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: YieldToken
    network: {{ network }}
    source:
      address: "{{ yt_address }}"
      abi: YieldToken
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - YTHolder
      abis:
        - name: YieldToken
          file: ./abis/{{ yt_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleYTTransfer
      file: ./src/mapping.ts
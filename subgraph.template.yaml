specVersion: 0.0.2
description: KodiakIslandWithRouter
repository:
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: RsethKodiakIslandWithRouter
    network: {{ network }}
    source:
      address: "{{ rseth_island_address }}"
      abi: KodiakIslandWithRouter
      startBlock: {{ rseth_island_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - RsethIslandHolder
        - RsethIslandBalances
      abis:
        - name: KodiakIslandWithRouter
          file: ./abis/{{ island_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleRsethIslandTransfer
        - event: Minted(address,uint256,uint256,uint256,uint128)
          handler: handleRsethBalanceChange
        - event: Burned(address,uint256,uint256,uint256,uint128)
          handler: handleRsethBalanceChange
        - event: Rebalance(indexed address,int24,int24,uint128,uint128)
          handler: handleRsethBalanceChange
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: RsethYieldToken
    network: {{ network }}
    source:
      address: "{{ rseth_yt_address }}"
      abi: YieldToken
      startBlock: {{ rseth_yt_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - RsethYTHolder
      abis:
        - name: YieldToken
          file: ./abis/{{ yt_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleRsethYTTransfer
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: UnibtcKodiakIslandWithRouter
    network: {{ network }}
    source:
      address: "{{ unibtc_island_address }}"
      abi: KodiakIslandWithRouter
      startBlock: {{ unibtc_island_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - UnibtcIslandHolder
        - UnibtcIslandBalances
      abis:
        - name: KodiakIslandWithRouter
          file: ./abis/{{ island_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUnibtcIslandTransfer
        - event: Minted(address,uint256,uint256,uint256,uint128)
          handler: handleUnibtcBalanceChange
        - event: Burned(address,uint256,uint256,uint256,uint128)
          handler: handleUnibtcBalanceChange
        - event: Rebalance(indexed address,int24,int24,uint128,uint128)
          handler: handleUnibtcBalanceChange
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: UnibtcYieldToken
    network: {{ network }}
    source:
      address: "{{ unibtc_yt_address }}"
      abi: YieldToken
      startBlock: {{ unibtc_yt_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - UnibtcYTHolder
      abis:
        - name: YieldToken
          file: ./abis/{{ yt_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUnibtcYTTransfer
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: SolvbtcKodiakIslandWithRouter
    network: {{ network }}
    source:
      address: "{{ solvbtc_island_address }}"
      abi: KodiakIslandWithRouter
      startBlock: {{ solvbtc_island_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - SolvbtcIslandHolder
        - SolvbtcIslandBalances
      abis:
        - name: KodiakIslandWithRouter
          file: ./abis/{{ island_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleSolvbtcIslandTransfer
        - event: Minted(address,uint256,uint256,uint256,uint128)
          handler: handleSolvbtcBalanceChange
        - event: Burned(address,uint256,uint256,uint256,uint128)
          handler: handleSolvbtcBalanceChange
        - event: Rebalance(indexed address,int24,int24,uint128,uint128)
          handler: handleSolvbtcBalanceChange
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: SolvbtcYieldToken
    network: {{ network }}
    source:
      address: "{{ solvbtc_yt_address }}"
      abi: YieldToken
      startBlock: {{ solvbtc_yt_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - SolvbtcYTHolder
      abis:
        - name: YieldToken
          file: ./abis/{{ yt_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleSolvbtcYTTransfer
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: ICHIVault
    network: {{ network }}
    source:
      address: "{{ rusd_vault_address }}"
      abi: ICHIVault
      startBlock: {{ rusd_vault_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - RusdVaultHolder
        - RusdVaultBalances
      abis:
        - name: ICHIVault
          file: ./abis/{{ vault_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleRusdVaultTransfer
        - event: Deposit(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleRusdBalanceChange
        - event: Withdraw(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleRusdBalanceChange
        - event: Rebalance(int24,uint256,uint256,uint256,uint256,uint256)
          handler: handleRusdBalanceChange
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: RusdYieldToken
    network: {{ network }}
    source:
      address: "{{ rusd_yt_address }}"
      abi: YieldToken
      startBlock: {{ rusd_yt_startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.5
      language: wasm/assemblyscript
      entities:
        - RusdYTHolder
      abis:
        - name: YieldToken
          file: ./abis/{{ yt_file }}.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleRusdYTTransfer
      file: ./src/mapping.ts
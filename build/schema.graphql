type IslandHolder @entity
{
  id:                           ID!
  address:                      String!
  islandAmt:                    BigInt!
}

type YTHolder @entity
{
  id:                           ID!
  address:                      String!
  ytAmt:                        BigInt!
}

type IslandBalances @entity
{
  id:                           ID!
  balance0:                     BigInt!
  balance1:                     BigInt!
}